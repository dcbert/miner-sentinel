manifestVersion: 1
id: miner-sentinel
storage:
  dataRoot: data
category: bitcoin
name: MinerSentinel
version: "1.1.1"
tagline: Multi-make Bitcoin mining monitor for home ASIC fleets
description: >-
  MinerSentinel is a self-hosted monitoring solution for Bitcoin home miners.
  It unifies Bitaxe, Avalon, NMAxe, NerdNOS, and other makes into one device registry
  and dashboard for fleet performance, hardware health, pool stats, cost analysis,
  and alerts—with all data stored locally.


  ⚙️ After install, open the app and sign in with username **admin** and the
  password shown by Umbrel for this app. Then add miners under Settings → Devices.


  **Real-Time Device Monitoring**

  Monitor hashrate, temperature, power consumption, and efficiency (J/TH) for each device.
  Visual status indicators show online, stale, offline, and inactive state.


  **Unified Multi-Make Fleet**

  Add miners of any supported make through a single Settings registry without restarting services.
  One detail view covers mining stats, hardware logs, and system information per device.


  **Pool Integration**

  Native support for CKPool, Public Pool, and BTC PoW Lab solo mining statistics.
  Track best shares, workers, and pool-side hashrate, plus solo-mining probability estimates.


  **Analytics and Cost Analysis**

  Interactive charts for hashrate and hardware trends over selectable time ranges.
  Configure energy rate and currency to estimate power cost; optional revenue-style stats use cached network data.


  **Intelligent Alerts**

  Telegram and Discord webhook notifications for offline devices, hashrate stagnation,
  new best difficulty, and automatic restart attempts when supported.


  **Built for Self-Sovereignty**

  Runs entirely on your own hardware. All metrics stay in your PostgreSQL database.
  Packaged for Umbrel with multi-architecture Docker images.

releaseNotes: >-
  MinerSentinel 1.1.1 brings a unified multi-make device model and broader pool support:


  - Unified device registry for Bitaxe, Avalon, NMAxe, NerdNOS, and related firmwares

  - Shared mining/hardware/system metrics tables with improved dashboards and time-range controls

  - Discord webhook alerts alongside Telegram

  - BTC PoW Lab Hybrid Solo pool statistics (configure under Settings)

  - Packaging fixes: correct Django SECRET_KEY/DEBUG env wiring and healthier Postgres startup


  After updating, open Settings → Devices to confirm your miners. Pool and notification
  options remain under Settings.

